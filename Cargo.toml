[workspace]
resolver = "2"
members = [
    "crates/solarium",
    "crates/solarium-macros",
    "crates/solarium-cli",
    "crates/solarium-workspace",
    "examples/hello-world"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Solarium is a framework for building Solana programs with a more idiomatic Rust experience."
license = "Apache-2.0"
authors = ["Danilo Guanabara <danilo@sensorial.systems>"]

[workspace.dependencies]
solarium = { version = "0.1.0", path = "crates/solarium" }
solarium-macros = { version = "0.1.0", path = "crates/solarium-macros" }
solarium-workspace = { version = "0.1.0", path = "crates/solarium-workspace" }

solana-sdk = "=1.18.26"
solana-program = "=1.18.26"
anchor-lang-idl-spec = "0.1.0"

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
shrinkwraprs = "0.3"
serde_json = "1"
walkdir = "2"
toml = "0.8.20"

bytemuck_derive = "=1.8.1"

ligen-ir = { path = "../ligen/ligen/ir" }
ligen-parser = { path = "../ligen/ligen/parser" }
ligen-rust-parser = { path = "../ligen/ecosystem/rust/parser" }
