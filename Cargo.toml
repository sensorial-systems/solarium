[workspace]
resolver = "2"
members = [
    "crates/solarium",
    "crates/solarium-macros",
    "crates/solarium-cli",
    "crates/solarium-workspace",
    "crates/solarium-client",
    "crates/solarium-program",
    "crates/solarium-rust-client-generator",
    "examples/solarium-example",
    "examples/file-upload-example",
    "examples/instruction-numbering-example",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "Solarium is a framework for building Solana programs with a more idiomatic Rust experience."
license = "Apache-2.0"
authors = ["Danilo Guanabara <danilo@sensorial.systems>"]

[workspace.dependencies]
solarium = { version = "0.1.0", path = "crates/solarium" }
solarium-program = { version = "0.1.0", path = "crates/solarium-program" }
solarium-macros = { version = "0.1.0", path = "crates/solarium-macros" }
solarium-workspace = { version = "0.1.0", path = "crates/solarium-workspace" }
solarium-client = { version = "0.1.0", path = "crates/solarium-client" }
solarium-rust-client-generator = { version = "0.1.0", path = "crates/solarium-rust-client-generator" }

solana-pubkey = { version = "3", features = ["borsh", "serde", "std"] }
solana-instruction = "3"
solana-sdk = "3.0"
solana-program = "3.0"
pinocchio = { version = "0.11.2", default-features = false, features = ["alloc", "copy", "sha2", "cpi", "account-resize"] }
pinocchio-system = "0.6.1"
solana-program-log = "1.2.0"
solana-address = { version = "2.7.0", default-features = false, features = ["curve25519"] }
solana-client = "3"
solana-commitment-config = "3"
solana-account-decoder-client-types = "3"
anchor-lang-idl-spec = "0.1.0"

async-trait = "0.1.88"

futures = "0.3"

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
shrinkwraprs = "0.3"
serde_json = "1"
walkdir = "2"
toml = "0.8.20"
sha2 = "0.10.2"
borsh = { version = "1.5.7", features = ["derive"] }
bytemuck = "1.16.3"

thiserror = "2.0.12"

bytemuck_derive = "=1.8.1"

syn = "2.0.29"
quote = "1.0.33"
proc-macro2 = "1"

ligen = { git = "https://github.com/sensorial-systems/ligen", rev = "2bbe045c95908ad14f386b791a160ea2433ece31" }
ligen-rust = { git = "https://github.com/sensorial-systems/ligen", rev = "2bbe045c95908ad14f386b791a160ea2433ece31" }
ligen-anchor = { git = "https://github.com/sensorial-systems/ligen", rev = "2bbe045c95908ad14f386b791a160ea2433ece31" }
