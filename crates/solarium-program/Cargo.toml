[package]
name = "solarium-program"
version.workspace = true
edition.workspace = true
readme.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
solarium.workspace = true
shrinkwraprs.workspace = true
thiserror.workspace = true
solana-sdk-ids = "3"
solana-pubkey = { workspace = true, features = ["curve25519"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solana-program = { workspace = true, optional = true }
pinocchio = { workspace = true, optional = true }
pinocchio-system = { workspace = true, optional = true }
solana-program-log = { workspace = true, optional = true }

[features]
default = ["solana-program-backend"]
solana-program-backend = ["dep:solana-program"]
pinocchio = ["dep:pinocchio", "dep:pinocchio-system", "dep:solana-program-log"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
