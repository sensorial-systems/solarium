[package]
name = "solarium-transaction"
version.workspace = true
edition.workspace = true
readme.workspace = true
description = "Target-independent Solana transaction construction for Solarium clients."
license.workspace = true
authors.workspace = true

[dependencies]
solana-pubkey = { version = "=2.1.0", features = ["curve25519", "serde"] }
solana-hash = { version = "=2.1.0", features = ["serde"] }
solana-instruction = "=2.1.0"
solana-short-vec = "=2.1.0"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bincode = "1.3.3"
